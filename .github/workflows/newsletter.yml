name: Field Notes Daily

on:
  schedule:
    - cron: '0 6 * * 3'  # Every Wednesday at 06:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore pipeline state (issue number + seen URLs)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/state/issue_number.txt
            pipeline/state/seen_urls.txt
          key: newsletter-state-${{ github.run_id }}
          restore-keys: newsletter-state-

      - name: Generate newsletter draft
        env:
          AZURE_OPENAI_ENDPOINT:   ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY:    ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: gpt-5-1
          BEEHIIV_API_KEY:         ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID:  ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: python pipeline/run.py

      - name: Upload draft and banner
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}-${{ github.run_id }}
          path: drafts/
          retention-days: 30
